name: Daily availability probe

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install httr2
        run: Rscript -e 'install.packages("httr2")'
      - name: Run probe
        run: Rscript audit/check_links.R
      - name: Commit probe results
        run: |
          git config user.name "probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/probes
          git diff --cached --quiet || git commit -m "probe: $(date -u +%F)"
          git push
